name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: mix check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Elixir / OTP
        id: beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Cache deps and _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-dev-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Cache Dialyzer PLTs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get --check-locked
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors
      - run: mix check

  test:
    name: test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.allow-failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { elixir: "1.18", otp: "25" }
          - { elixir: "1.18", otp: "27" }
          - { elixir: "1.19", otp: "26" }
          - { elixir: "1.19", otp: "28" }
          - { elixir: "1.20", otp: "28" }
          - { elixir: "main", otp: "28", allow-failure: true }
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Elixir / OTP
        id: beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps and _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
      - run: mix test

  ecto:
    # Compatibility sweep: every supported Ecto minor line from the declared minimum
    # (3.12) up to the latest published release, plus the development tip of Ecto. The
    # dev-tip entry is advisory (allow-failure: true) so upstream breakage warns without
    # failing the run. ecto_sql/ecto_sqlite3 are pinned to the matching line because their
    # versions track Ecto's. Each entry resolves into its own generated lockfile.
    #
    # This job also carries the **Postgres** coverage: `MUTARE_TEST_POSTGRES` makes the semantic
    # suite run its fixtures against the service container below as a second test module (alongside
    # the always-on SQLite one), so a single `mix test` exercises both engines. Postgres runs across
    # *every* Ecto line — not just the elixir/otp `test` sweep — so any change in Ecto's handling of
    # Postgres-only behaviour is caught on the whole version matrix. (The elixir/otp `test` job stays
    # SQLite-only: the non-semantic tests never touch a DB, so a second engine adds no signal there.)
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.allow-failure || false }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mutare_ecto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test (Ecto 3.12, minimum)
            lockfile: mix-ecto-3.12.lock
            ecto: "== 3.12.0"
            ecto_sql: "== 3.12.0"
            ecto_sqlite3: "== 0.17.0"
          - name: test (Ecto 3.13)
            lockfile: mix-ecto-3.13.lock
            ecto: "~> 3.13.0"
            ecto_sql: "~> 3.13.0"
            ecto_sqlite3: "~> 0.23.0"
          - name: test (Ecto 3.14, latest)
            lockfile: mix-ecto-3.14.lock
            ecto: "~> 3.14.0"
            ecto_sql: "~> 3.14.0"
            ecto_sqlite3: "~> 0.24.0"
          - name: test (Ecto main, dev tip)
            lockfile: mix-ecto-main.lock
            ecto_git_branch: master
            ecto_sqlite3: "~> 0.24.0"
            allow-failure: true
    env:
      MIX_ENV: test
      MIX_LOCKFILE: ${{ matrix.lockfile }}
      ECTO_REQUIREMENT: ${{ matrix.ecto }}
      ECTO_SQL_REQUIREMENT: ${{ matrix.ecto_sql }}
      ECTO_SQLITE3_REQUIREMENT: ${{ matrix.ecto_sqlite3 }}
      ECTO_GIT_BRANCH: ${{ matrix.ecto_git_branch }}
      MUTARE_TEST_POSTGRES: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: mutare_ecto_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Elixir / OTP
        id: beam
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Cache deps and _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.lockfile }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.exs') }}

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
